[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-standup"
dynamic = ["version"]
description = "A TUI command center for OpenCode sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Gessler" }]
dependencies = ["packaging>=23", "textual>=8.2.8,<9"]

[project.urls]
Homepage = "https://github.com/RAGessler/opencode-standup"
Repository = "https://github.com/RAGessler/opencode-standup"
Issues = "https://github.com/RAGessler/opencode-standup/issues"

[tool.setuptools.dynamic]
version = { attr = "opencode_standup.__version__" }

[project.scripts]
opencode-standup = "opencode_standup.app:main"

[tool.setuptools.packages.find]
where = ["src"]
