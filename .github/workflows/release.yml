name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v-prefixed tag to publish"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: PYTHONPATH=src python scripts/check_release_tag.py
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/audit_package.py dist/*
      - name: Publish to GitHub Packages
        run: >-
          python -m twine upload
          --repository-url https://upload.pypi.pkg.github.com/
          --username ${{ github.actor }}
          --password ${{ secrets.GITHUB_TOKEN }}
          dist/*

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          release_name: ${{ inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
