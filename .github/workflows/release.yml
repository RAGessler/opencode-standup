name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v-prefixed tag to publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - name: Validate release tag
        run: |
          package_version=$(python -c 'import re; from pathlib import Path; print(re.search(r"__version__ = \"([^\"]+)\"", Path("src/opencode_standup/__init__.py").read_text()).group(1))')
          expected_tag="v${package_version}"
          test "${RELEASE_TAG}" = "${expected_tag}" || {
            echo "Release tag ${RELEASE_TAG} does not match package version ${package_version}." >&2
            exit 1
          }
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/audit_package.py dist/*
      - name: Store release distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          release_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false
